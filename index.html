<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FAFAFB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18181B" media="(prefers-color-scheme: dark)">

<title>Sudotome</title>
<meta name="description" content="Sudotome is a new game studio working on its first release. Sign-up for updates is coming soon.">
<meta property="og:type" content="website">
<meta property="og:title" content="Sudotome">
<meta property="og:description" content="A new game studio. First release in progress.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>
  /* Graphite Pro. Light is the base; dark applies when the visitor's device
     prefers it, unless they have picked a mode with the toggle. */
  :root {
    --bg: #FAFAFB;
    --surface: #F1F1F3;
    --text: #1A1A1E;
    --muted: #75757E;
    --border: #E1E1E5;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #18181B;
      --surface: #212126;
      --text: #F4F4F5;
      --muted: #A0A0AA;
      --border: #303035;
    }
  }

  [data-theme="dark"] {
    --bg: #18181B;
    --surface: #212126;
    --text: #F4F4F5;
    --muted: #A0A0AA;
    --border: #303035;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .wrap {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    text-align: center;
  }

  .status-eyebrow {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .wordmark {
    font-family: 'Space Grotesk', system-ui, sans-serif;
    font-weight: 600;
    font-size: clamp(2.4rem, 8vw, 3.6rem);
    letter-spacing: -0.01em;
    margin-bottom: 18px;
  }
  .wordmark .sudo { color: var(--text); }
  .wordmark .tome { color: var(--muted); }
  .wordmark .cursor {
    display: inline-block;
    width: 3px;
    height: 0.75em;
    background: var(--text);
    margin-left: 4px;
    transform: translateY(3px);
    animation: blink 1.1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .tagline {
    font-size: 15px;
    color: var(--muted);
    max-width: 42ch;
    line-height: 1.6;
    margin: 0 0 46px;
  }

  .signup-block {
    width: 100%;
    max-width: 380px;
  }
  .signup-row {
    display: flex;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px;
  }
  .signup-row input {
    flex: 1;
    min-width: 0;
    border: none;
    background: transparent;
    padding: 10px;
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 13.5px;
    color: var(--muted);
    outline: none;
  }
  .signup-row input::placeholder { color: var(--muted); }
  .signup-row button {
    font-family: 'Inter', system-ui, sans-serif;
    font-weight: 500;
    font-size: 13px;
    padding: 10px 16px;
    border-radius: 5px;
    border: none;
    background: var(--border);
    color: var(--muted);
    cursor: not-allowed;
  }
  .signup-note {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10.5px;
    color: var(--muted);
    margin-top: 10px;
  }

  .theme-toggle {
    position: absolute;
    top: 22px;
    right: 22px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px;
    color: var(--muted);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 14px;
    cursor: pointer;
  }
  .theme-toggle:hover { color: var(--text); border-color: var(--muted); }
  .theme-toggle:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    .wordmark .cursor { animation: none; }
    html, body { transition: none; }
  }
</style>
</head>
<body>

<button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch between light and dark mode">Dark mode</button>

<main class="wrap">
  <div class="status-eyebrow">$ studio --status</div>
  <h1 class="wordmark" style="margin-top:0;"><span class="sudo">sudo</span><span class="tome">tome</span><span class="cursor" aria-hidden="true"></span></h1>
  <p class="tagline">A new game studio. First release in progress.</p>

  <div class="signup-block">
    <div class="signup-row">
      <input type="email" placeholder="you@example.com" aria-label="Email address" disabled>
      <button type="button" disabled>Notify me</button>
    </div>
    <div class="signup-note">// mailing list signup coming soon</div>
  </div>
</main>

<script>
  (function () {
    var root = document.documentElement;
    var toggle = document.getElementById('themeToggle');
    var media = window.matchMedia('(prefers-color-scheme: dark)');

    function effectiveTheme() {
      var set = root.getAttribute('data-theme');
      if (set === 'light' || set === 'dark') return set;
      return media.matches ? 'dark' : 'light';
    }

    function updateLabel() {
      toggle.textContent = effectiveTheme() === 'dark' ? 'Light mode' : 'Dark mode';
    }

    toggle.addEventListener('click', function () {
      root.setAttribute('data-theme', effectiveTheme() === 'dark' ? 'light' : 'dark');
      updateLabel();
    });

    if (media.addEventListener) {
      media.addEventListener('change', updateLabel);
    }

    updateLabel();
  })();
</script>

</body>
</html>
